<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>旅行设计方案</title>
  <style>
    :root{
      --bg:#f5f7fa; --surface:#fff; --ink:#2a2f3a; --muted:#6b7180;
      --brand:#5f8cc0; --line:#e6ebf2; --shadow:0 2px 10px rgba(42,47,58,.05);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:system-ui,-apple-system,'PingFang SC',sans-serif;line-height:1.6}
    .wrap{max-width:820px;margin:0 auto;padding:56px 20px 72px}
    header{text-align:center;margin-bottom:40px}
    header h1{font-size:28px;margin:0 0 8px}
    header p{color:var(--muted);margin:0;font-size:15px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
    .card{display:block;background:var(--surface);border:1px solid var(--line);
      border-radius:16px;padding:22px;text-decoration:none;color:inherit;
      box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
    .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(42,47,58,.1)}
    .card .emoji{font-size:30px;line-height:1;margin-bottom:12px}
    .card h2{font-size:17px;margin:0 0 6px}
    .card p{margin:0;color:var(--muted);font-size:13px}
    .card .go{margin-top:14px;font-size:13px;font-weight:600;color:var(--brand)}
    footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div id="tp-gate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-family:system-ui,-apple-system,'PingFang SC',sans-serif">
    <form id="tp-gate-form" style="width:min(90vw,340px);background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:28px 24px;box-shadow:0 8px 30px rgba(42,47,58,.08);text-align:center">
      <div style="font-size:34px;line-height:1;margin-bottom:14px">🔒</div>
      <div style="font-size:16px;font-weight:600;color:#2a2f3a;margin-bottom:4px">需要访问密码</div>
      <div style="font-size:13px;color:#6b7180;margin-bottom:18px">请输入密码查看旅行方案</div>
      <input id="tp-gate-pw" type="password" inputmode="numeric" autocomplete="off" placeholder="密码"
        style="width:100%;box-sizing:border-box;padding:11px 12px;font-size:15px;border:1px solid #d8e0ea;border-radius:10px;outline:none;text-align:center;letter-spacing:2px">
      <div id="tp-gate-err" style="height:18px;margin-top:8px;font-size:12px;color:#d9534f"></div>
      <button type="submit" style="width:100%;padding:11px;font-size:15px;font-weight:600;color:#fff;background:#5f8cc0;border:none;border-radius:10px;cursor:pointer">进入</button>
    </form>
  </div>
  <script>
  (function(){
    var HASH='e8d705aa48b29ca08adc665f7de5fc5c6ca97d53d595ecb4be41f5ec223f4eaa';
    var KEY='tp_auth';
    var gate=document.getElementById('tp-gate');
    var form=document.getElementById('tp-gate-form');
    var pw=document.getElementById('tp-gate-pw');
    var err=document.getElementById('tp-gate-err');
    function unlock(){ gate.parentNode.removeChild(gate); document.body.style.overflow=''; }
    async function sha256(s){
      var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    }
    if(sessionStorage.getItem(KEY)===HASH){ unlock(); return; }
    document.body.style.overflow='hidden';
    pw.focus();
    form.addEventListener('submit',async function(e){
      e.preventDefault();
      var h=await sha256(pw.value);
      if(h===HASH){ sessionStorage.setItem(KEY,HASH); unlock(); }
      else{ err.textContent='密码错误'; pw.value=''; pw.focus(); }
    });
  })();
  </script>

  <div class="wrap">
    <header>
      <h1>旅行设计方案</h1>
      <p>选择一个行程查看详情</p>
    </header>
    <div class="grid">
      <a class="card" href="guiyang.html">
        <div class="emoji">🏞️</div>
        <h2>贵阳五天四晚</h2>
        <p>水上户外 · 三段徒步 · 老城休闲</p>
        <div class="go">查看行程 →</div>
      </a>
      <a class="card" href="usa.html">
        <div class="emoji">🗽</div>
        <h2>美国四城旅行计划</h2>
        <p>2026-09-24 至 10-07</p>
        <div class="go">查看行程 →</div>
      </a>
      <a class="card" href="hoian.html">
        <div class="emoji">🏮</div>
        <h2>会安 · 岘港</h2>
        <p>4天3晚 · 6.18 - 6.21</p>
        <div class="go">查看行程 →</div>
      </a>
    </div>
    <footer>更多方案陆续加入</footer>
  </div>
</body>
</html>
